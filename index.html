<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flipbook Studio</title>
<style>
:root{--bg:#f2f2f5;--pn:#fff;--tx:#1c1c22;--mu:#7a7a86;--ac:#6c4cff;--bd:#d8d8e0;--cv:#dcdce3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141417;--pn:#202026;--tx:#eee;--mu:#9a9aa6;--bd:#33333b;--cv:#0d0d10}}
:root[data-theme="dark"]{--bg:#141417;--pn:#202026;--tx:#eee;--mu:#9a9aa6;--bd:#33333b;--cv:#0d0d10}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:center;gap:2px;padding:4px 6px;background:var(--pn);border-bottom:1px solid var(--bd)}
.bar.b{border:0;border-top:1px solid var(--bd)}
.bar.b button{min-width:36px;padding:0 4px}
#fb{position:absolute;display:none;transform:translate(-50%,-100%);gap:2px;background:var(--pn);border-radius:12px;padding:2px;box-shadow:0 2px 10px #0006;z-index:6}
#fb button{min-width:34px;height:34px;font-size:16px}
button{min-width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--tx);font-size:18px;padding:0 6px}
button.on{background:var(--ac);color:#fff}
.sp{flex:1}
#cur{position:absolute;pointer-events:none;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px #000a,inset 0 0 0 1px #000a;transform:translate(-50%,-50%);z-index:4;display:none}
#cur::after{content:'';position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px #000a}
#view{cursor:none}
#pn{position:absolute;left:8px;top:6px;z-index:5;background:var(--pn);color:var(--tx);padding:4px 10px;border-radius:14px;font-size:12px;opacity:.92;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=range]{accent-color:var(--ac)}
input[type=number],input[type=color]{height:34px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input[type=color]{width:40px;padding:2px}
#wrap{flex:1;position:relative;overflow:hidden;background:var(--cv);touch-action:none}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;box-shadow:0 2px 20px #0005}
#view{width:960px;height:540px;display:block;touch-action:none}
#tlw{flex:1;min-width:0;overflow:auto;max-height:150px;position:relative;touch-action:pan-x pan-y}
#strip{display:flex;gap:6px;padding:6px;width:max-content}
#lanes{position:relative;padding-bottom:4px}
.lh{position:sticky;left:6px;display:flex;gap:6px;height:34px;align-items:center;z-index:3;width:max-content}
.lh button{height:30px;min-width:0;font-size:13px;background:var(--bd);padding:0 10px}
.lane{position:relative;height:32px}
.ac{position:absolute;top:2px;height:28px;border-radius:6px;background:#2a9d8f;overflow:hidden;touch-action:none}
.ac canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.ac b{position:absolute;left:4px;top:2px;font:10px system-ui;color:#fff;white-space:nowrap}
.ac.mu{opacity:.4}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#ffb300;pointer-events:none;z-index:2}
.fr{flex:none;position:relative;border:2px solid var(--bd);border-radius:6px;overflow:hidden;height:54px}
.fr.on{border-color:var(--ac)}
.fr canvas{display:block;background:#fff}
.fr b{position:absolute;left:2px;top:0;font:11px system-ui;color:#4dd0ff}
.fr u{position:absolute;right:2px;top:0;font:11px system-ui;color:#ffb300;text-decoration:none}.fr i{position:absolute;left:2px;bottom:1px;font:10px system-ui;background:#000a;color:#fff;padding:0 3px;border-radius:3px}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:46%;overflow:auto;background:var(--pn);border-radius:16px 16px 0 0;box-shadow:0 -4px 24px #0006;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px));touch-action:pan-y;z-index:9}
#sheet[hidden]{display:none}
.hd{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px}
.row{display:flex;align-items:center;gap:8px;padding:2px 4px;border-radius:10px}
.row.on{background:var(--bd)}
.row span{flex:1}
.row input[type=range]{width:90px}
.wide{width:100%;text-align:left;font-size:15px}
#sheet video,#sheet img{width:100%;border-radius:8px;background:#fff;margin:8px 0}
#toast{position:fixed;top:calc(60px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:6px 12px;border-radius:14px;z-index:10}
#toast[hidden]{display:none}

/* v2 interface */
:root{--bg:#f4f4f7;--pn:#ffffff;--tx:#16161b;--mu:#6c6c78;--ac:#5b4bff;--bd:#e3e3ea;--cv:#e6e6ec}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121215;--pn:#1b1b20;--tx:#ececf1;--mu:#9a9aa8;--bd:#2c2c34;--cv:#0b0b0e}}
:root[data-theme="dark"]{--bg:#121215;--pn:#1b1b20;--tx:#ececf1;--mu:#9a9aa8;--bd:#2c2c34;--cv:#0b0b0e}
body{font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{gap:2px;padding:3px 6px;background:var(--pn);border-bottom:1px solid var(--bd)}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:38px;height:38px;padding:0 8px;border:0;border-radius:9px;background:transparent;color:var(--tx);font:500 14px system-ui,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{background:var(--bd)}
button.on{background:var(--ac);color:#fff}
.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor}
:is(span,p,div,b,summary)>.i{margin-right:.3em;vertical-align:-.2em}
button[data-l]{flex-direction:column;gap:2px;height:46px;min-width:38px;padding:0 2px;font-size:17px}
button[data-l]::after{content:attr(data-l);font:500 9.5px/1 system-ui,sans-serif;letter-spacing:.2px;opacity:.78}
.sep{width:1px;height:28px;background:var(--bd);margin:0 3px;flex:none}
.fpsb{display:flex;align-items:center;gap:3px;color:var(--mu);font-size:11px}
#fps{width:40px;text-align:center}
input[type=number],input[type=color]{height:32px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.tools #col{width:34px;height:34px;padding:2px;border-radius:50%;flex:none}
.tools #size{flex:1;min-width:64px;margin:0 6px}
.tl{align-items:stretch}
.tlb{display:flex;flex-direction:column;justify-content:center;flex:none}
.tlb button{height:40px;min-width:40px}
#pn{display:flex;align-items:center;left:8px;top:8px;background:var(--pn);border:1px solid var(--bd);padding:5px 12px 5px 8px;font-weight:600;box-shadow:0 1px 6px #0002}
#hb{position:absolute;right:8px;top:8px;z-index:5;width:34px;height:34px;min-width:0;padding:0;border-radius:50%;background:var(--pn);border:1px solid var(--bd);box-shadow:0 1px 6px #0002}
#sheet{border-radius:18px 18px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom,0px))}
#sheet::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:var(--bd);margin:0 auto 8px}
.hd{font-size:16px;font-weight:650;padding:0 0 6px}
.sec{font:600 11px system-ui,sans-serif;letter-spacing:.7px;text-transform:uppercase;color:var(--mu);padding:12px 4px 3px}
.wide{justify-content:flex-start;width:100%;height:44px;padding:0 12px;margin:3px 0;border-radius:10px;background:var(--bg);font-size:15px}
.row{padding:3px 4px}
#toast{background:#16161bdd;color:#fff;border-radius:12px;font-size:13px;padding:7px 14px;max-width:86%;text-align:center}
#help{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;overflow:auto;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text;padding-top:env(safe-area-inset-top,0px)}
.hh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--bd);font-size:17px}
.hb{padding:8px 12px 48px;max-width:640px;margin:0 auto}
details{background:var(--pn);border:1px solid var(--bd);border-radius:12px;margin:8px 0;padding:0 14px}
summary{padding:13px 0;font-weight:600;cursor:pointer;font-size:15px}
.hi{display:flex;flex-direction:column;padding:9px 0;border-top:1px solid var(--bd)}
.hi b{font-size:14px}.hi span{color:var(--mu);font-size:13px;line-height:1.5;margin-top:2px}
</style></head><body>
<div id="app">
<div class="bar top">
<button id="undo" data-l="Undo">↶</button><button id="redo" data-l="Redo">↷</button><span class="sep"></span>
<button id="play" data-l="Play">▶</button><label class="fpsb"><input id="fps" type="number" min="1" max="60" value="12"><span>fps</span></label>
<span class="sp"></span>
<button id="onion" class="on" data-l="Onion">🧅</button><button id="mo" data-l="Motion">🎯</button><button id="lib" data-l="Library">📚</button><button id="lay" data-l="Layers">☰</button><button id="menu" data-l="More">⋯</button>
</div>
<div id="wrap"><div id="pn"></div><button id="hb" title="Help">❔</button><div id="cur"></div><div id="fb"></div><div id="stage"><canvas id="view" width="960" height="540"></canvas></div></div>
<div class="bar b tools">
<button id="t-brush" class="on" data-l="Brush">✎</button><button id="t-eraser" data-l="Erase">⌫</button><button id="t-fill" data-l="Fill">🪣</button><button id="t-move" data-l="Select">✥</button><button id="bt" data-l="Brushes">🖌</button>
<span class="sep"></span><input id="col" type="color" value="#000000"><input id="size" type="range" min="1" max="60" value="6"><button id="fit" data-l="Fit">⤢</button>
</div>
<div class="bar b tl">
<div class="tlb"><button id="addf" data-l="Add">＋</button><button id="dupf" data-l="Copy">⎘</button><button id="delf" data-l="Delete">🗑</button></div>
<div id="tlw"><div id="strip"></div><div id="lanes"></div></div>
</div>
</div>
<div id="sheet" hidden></div><div id="toast" hidden></div>
<script>
const W=960,H=540,$=s=>document.querySelector(s);

const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};

 for(const o of objs){if(o.cam||(!o.sym&&!o.mouth&&!o.vec&&!o.pt))continue;let v=val(o,i);if(!v)continue;
  if(o.trail&&o.trail.n>0)for(let k=o.trail.n;k>=1;k--){const f2=i-k*(o.trail.g||1);let w=val(o,f2);if(!w)continue;w=applyFx(o,w,f2);drawObjFx(x,o,w,f2,a*.45*(1-(k-1)/o.trail.n))}
  v=applyFx(o,v,i);drawObjFx(x,o,v,i,a)}

 if(onion&&!playing)[[cf-1,.3],[cf+1,.15]].forEach(([i,a])=>frames[i]&&comp(i,vc,a));
 (playing||scenePrev?compT:comp)(cf,vc,1);if(playing||scenePrev)postFx(vc,cf);overlay();selDraw();[...$('#strip').children].forEach((d,i)=>d.classList.toggle('on',i==cf));movePH()}

const thumbCur=()=>{const c=$('#strip').children[cf]?.querySelector('canvas');c&&thumb(cf,c)};

// undo/redo (per frame+layer snapshots)
const snap=(f=cf,l=cl)=>({f,l,d:frames[f].l[l].getContext('2d').getImageData(0,0,W,H)});
function push(){U.push(snap());if(U.length>20)U.shift();R=[]}
function restore(s){frames[s.f].l[s.l].getContext('2d').putImageData(s.d,0,0);cf=s.f;cl=s.l;render();thumbCur();sched()}
const reset=()=>{U=[];R=[];if(typeof snapS=='function'){base=snapS();lastSig=sig()}};

// drawing
const pos=e=>{const r=view.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
const rgb=()=>{const v=parseInt($('#col').value.slice(1),16);return[v>>16,v>>8&255,v&255]};
function begin(e){if(!layers[cl].vis){toast('Layer is hidden');return}
 if(tool=='pen'||tool=='node'||tool=='bone'||tool=='pose'){vecBegin(e);return}push();if(tool=='move'){U.pop();selBegin(e);return}const L=frames[cf].l[cl],p=pos(e);
 if(tool=='fill'){fill(L,p[0]|0,p[1]|0);render();thumbCur();sched();return}
 st={p,m:p,L};dot(e)}
function style(c,e){const sz=+$('#size').value*(e.pointerType=='pen'?Math.max(.25,e.pressure*1.7):1);
 c.globalCompositeOperation=tool=='eraser'?'destination-out':'source-over';c.strokeStyle=c.fillStyle=$('#col').value;c.lineWidth=sz;c.lineCap=c.lineJoin='round';c.shadowBlur=0;c.globalAlpha=1;if(tool!='eraser'){if(br=='soft'){c.shadowBlur=sz*.8;c.shadowColor=$('#col').value}else if(br=='marker'){c.lineCap='square';c.lineWidth=sz*1.6}else if(br=='pencil'){c.globalAlpha=.85;c.lineWidth=Math.max(1,sz*.45)}}return sz}
function dot(e){const c=st.L.getContext('2d'),sz=style(c,e);c.beginPath();c.arc(st.p[0],st.p[1],sz/2,0,7);c.fill();req()}
function seg(e){if(st.vec){vecMove(e);return}if(st.sc){const[x,y]=pos(e),k=st.k;k.s=Math.max(.05,st.s0*Math.hypot(x-st.cx,y-st.cy)/st.d0);k.r=st.r0+(Math.atan2(y-st.cy,x-st.cx)-st.a0)*180/Math.PI;return}if(st.mv){const[x,y]=pos(e),o=objs[sel],k=o.kf[cf]||(o.kf[cf]={...cur(o,cf)});k.x+=x-st.p[0];k.y+=y-st.p[1];st.p=[x,y];return}const c=st.L.getContext('2d');style(c,e);const[x,y]=pos(e),m=[(st.p[0]+x)/2,(st.p[1]+y)/2];
 c.beginPath();c.moveTo(...st.m);c.quadraticCurveTo(...st.p,...m);c.stroke();st.m=m;st.p=[x,y]}
function fill(L,x,y){const t=mk(),tx=t.getContext('2d');tx.fillStyle='#fff';tx.fillRect(0,0,W,H);comp(cf,tx);
 const d=tx.getImageData(0,0,W,H).data,lc=L.getContext('2d'),im=lc.getImageData(0,0,W,H),o=im.data,[r,gg,b]=rgb(),i0=(y*W+x)*4,tr=[d[i0],d[i0+1],d[i0+2]];
 if(tr[0]==r&&tr[1]==gg&&tr[2]==b)return;
 const ok=p=>{const i=p*4;return Math.abs(d[i]-tr[0])+Math.abs(d[i+1]-tr[1])+Math.abs(d[i+2]-tr[2])<90};
 const seen=new Uint8Array(W*H),S=[y*W+x];seen[S[0]]=1;
 while(S.length){const p=S.pop(),i=p*4,px=p%W;o[i]=r;o[i+1]=gg;o[i+2]=b;o[i+3]=255;
  for(const n of[px>0?p-1:-1,px<W-1?p+1:-1,p>=W?p-W:-1,p<W*(H-1)?p+W:-1])if(n>=0&&!seen[n]&&ok(n)){seen[n]=1;S.push(n)}}
 lc.putImageData(im,0,0)}

// pointer + two-finger pan/zoom
view.onpointerdown=e=>{curMove(e);e.preventDefault();view.setPointerCapture(e.pointerId);P.set(e.pointerId,e);if(P.size==1)tapG={t:performance.now(),n:1,mv:0};else if(tapG)tapG.n=Math.max(tapG.n,P.size);
 if(P.size==2){if(st){const m=st.mv||st.vec;st=null;if(!m){const s=U.pop();s&&restore(s)}}const[a,b]=[...P.values()];g={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),c:[(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2]};G=1;return}
 if(P.size==1&&!G&&!playing)begin(e)};

 if(P.size>=2&&g){const[a,b]=[...P.values()],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),c=[(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2];
  const k=Math.min(8,Math.max(.3,Z.s*d/g.d))/Z.s,wr=wrap.getBoundingClientRect();
  Z.x=c[0]-wr.left-(g.c[0]-wr.left-Z.x)*k;Z.y=c[1]-wr.top-(g.c[1]-wr.top-Z.y)*k;Z.s*=k;g={d,c};applyZ()}
 else if(st){for(const c of(e.getCoalescedEvents?.()||[e]))seg(c);req()}};

function fitView(){const w=wrap.clientWidth,hh=wrap.clientHeight,s=Math.min(w/W,hh/H)*.96;Z={s,x:(w-W*s)/2,y:(hh-H*s)/2};applyZ()}
addEventListener('resize',fitView);

// frames
const touch=()=>{reset();const d=frames.length-plen;if(d)shiftKf(d);plen=frames.length;buildTL();sched()};
$('#addf').onclick=()=>{frames.splice(cf+1,0,{l:layers.map(mk)});cf++;touch()};
$('#dupf').onclick=()=>{frames.splice(cf+1,0,{l:frames[cf].l.map(c=>{const n=mk();n.getContext('2d').drawImage(c,0,0);return n})});cf++;touch()};
$('#delf').onclick=()=>{if(frames.length<2){frames[0].l.forEach(c=>c.getContext('2d').clearRect(0,0,W,H))}else{frames.splice(cf,1);cf=Math.min(cf,frames.length-1)}touch()};

// layers

const DB=()=>new Promise((res,rej)=>{const r=indexedDB.open('fbs',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=rej});
